apiVersion: apps/v1
kind: Deployment
metadata:
  name: scas-backend
  namespace: scas-staging
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: scas-backend
  template:
    metadata:
      labels:
        app: scas-backend
    spec:
      containers:
        - name: backend
          image: hashicorp/http-echo:0.2.3
          args:
            - "-text=staging backend"
            - "-listen=:8080"
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: scas-backend
  namespace: scas-staging
spec:
  selector:
    app: scas-backend
  ports:
    - port: 80
      targetPort: 8080
  type: LoadBalancer
