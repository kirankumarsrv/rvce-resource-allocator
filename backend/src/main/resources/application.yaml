spring:
  profiles:
    active: dev
  flyway:
    repair-on-migrate: true

---

spring:
  config:
    activate:
      on-profile: dev
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL:jdbc:postgresql://localhost:5432/scas_db?stringtype=unspecified}
    username: ${DB_USER:scas}
    password: ${DB_PASSWORD:scas_dev_password}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      max-lifetime: 1800000
      connection-timeout: 30000
      validation-timeout: 5000
      idle-timeout: 600000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Redis configuration for token storage and caching
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms
      database: 0

  flyway:
    repair-on-migrate: true

# JWT configuration for token signing and validation
scas:
  jwt:
    private-key-path: ${JWT_PRIVATE_KEY_PATH:}
    public-key-path: ${JWT_PUBLIC_KEY_PATH:}
    access-token-expiry-ms: ${JWT_ACCESS_TOKEN_EXPIRY_MS:900000}  # 15 minutes
    refresh-token-expiry-seconds: ${JWT_REFRESH_TOKEN_EXPIRY_SECONDS:604800}  # 7 days

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health

