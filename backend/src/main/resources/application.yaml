spring:
  profiles:
    active: dev

---

spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/scas_db?stringtype=unspecified}
    username: ${DB_USER:scas}
    password: ${DB_PASSWORD:scas_dev_password}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Redis configuration for token storage and caching
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms
      database: 0

# JWT configuration for token signing and validation
scas:
  jwt:
    private-key-path: ${JWT_PRIVATE_KEY_PATH:}
    public-key-path: ${JWT_PUBLIC_KEY_PATH:}
    access-token-expiry-ms: ${JWT_ACCESS_TOKEN_EXPIRY_MS:900000}  # 15 minutes
    refresh-token-expiry-seconds: ${JWT_REFRESH_TOKEN_EXPIRY_SECONDS:604800}  # 7 days

# Room Navigation configuration (T-301, T-302, T-303)
room:
  search:
    min-query-length: ${ROOM_SEARCH_MIN_QUERY_LENGTH:2}
    max-results: ${ROOM_SEARCH_MAX_RESULTS:10}
  floor-plan:
    presigned-url:
      ttl-seconds: ${ROOM_FLOOR_PLAN_PRESIGNED_URL_TTL_SECONDS:3600}  # 1 hour

# AWS configuration for S3 (floor plans)
aws:
  s3:
    bucket-name: ${AWS_S3_BUCKET_NAME:scas-rvce-floor-plans}
    region: ${AWS_REGION:ap-south-1}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health

