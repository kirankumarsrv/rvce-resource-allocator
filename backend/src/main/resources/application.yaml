spring:
  config:
    import:
      - optional:aws-secrets:${SCAS_SECRETS_NAME:dev/scas/secrets}
  profiles:
    active: dev
  flyway:
    repair-on-migrate: true

scas:
  encryption:
    key: ${SCAS_ENCRYPTION_KEY:${encryption-key:}}
  jwt:
    private-key: ${JWT_PRIVATE_KEY:${jwt-private-key:}}
    public-key: ${JWT_PUBLIC_KEY:${jwt-public-key:}}

---

spring:
  config:
    activate:
      on-profile: dev
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL:jdbc:postgresql://localhost:5432/scas_db?stringtype=unspecified&sslmode=disable}
    username: ${DB_USER:scas}
    password: ${DB_PASSWORD:scas_dev_password}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      max-lifetime: 1800000
      connection-timeout: 30000
      validation-timeout: 5000
      idle-timeout: 600000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  mail:
    # Configure a real SMTP provider for password reset emails.
    # Example values must be provided through environment variables.
    host: ${SPRING_MAIL_HOST:}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    protocol: ${SPRING_MAIL_PROTOCOL:smtp}
    from: ${SPRING_MAIL_FROM:noreply@rvce.edu.in}
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_AUTH:true}
          starttls:
            enable: ${SPRING_MAIL_STARTTLS_ENABLE:true}

  # Redis configuration for token storage and caching
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms
      database: 0

  flyway:
    repair-on-migrate: true

# JWT configuration for token signing and validation
scas:
  jwt:
    private-key-path: ${JWT_PRIVATE_KEY_PATH:}
    public-key-path: ${JWT_PUBLIC_KEY_PATH:}
    access-token-expiry-ms: ${JWT_ACCESS_TOKEN_EXPIRY_MS:900000}  # 15 minutes
    refresh-token-expiry-seconds: ${JWT_REFRESH_TOKEN_EXPIRY_SECONDS:604800}  # 7 days

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health

---

