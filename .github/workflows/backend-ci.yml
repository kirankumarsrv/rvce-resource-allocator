name: Backend CI

permissions:
  id-token: write
  contents: read

on:
  push:
    branches: [main, develop]
    paths: ['backend/**', '.github/workflows/backend-ci.yml']
  pull_request:
    branches: [main, develop]
    paths: ['backend/**']

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Gradle execute permissions
        run: chmod +x backend/gradlew

      - name: Run tests with coverage
        working-directory: backend
        env:
          SPRING_PROFILES_ACTIVE: test
          JWT_SECRET: ci-test-secret-not-real-not-used-in-production
        run: ./gradlew test jacocoTestReport

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: backend/build/reports/tests/

      - name: SonarQube scan
        working-directory: backend
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: ./gradlew sonarqube
        continue-on-error: true

      - name: OWASP Dependency Check
        working-directory: backend
        run: ./gradlew dependencyCheckAnalyze -DfailBuildOnCVSS=7
        continue-on-error: true

  build-and-push:
    name: Build Docker Image & Push to ACR
    runs-on: ubuntu-22.04
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Azure Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry (ACR)
        run: |
          az acr login --name ${{ secrets.AZURE_REGISTRY_NAME }}

      - name: Build and Push Docker image
        working-directory: backend
        env:
          ACR_REGISTRY: ${{ secrets.AZURE_REGISTRY_NAME }}.azurecr.io
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE="${ACR_REGISTRY}/scas-backend:${IMAGE_TAG}"
          LATEST_IMAGE="${ACR_REGISTRY}/scas-backend:latest"
          docker build -t "$IMAGE" -t "$LATEST_IMAGE" .
          docker push "$IMAGE"
          docker push "$LATEST_IMAGE"