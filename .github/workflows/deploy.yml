name: Deploy to Azure

# Pre-deployment checklist:
# 1. Ensure secrets exist in GitHub Settings -> Secrets and variables -> Actions:
#    - AZURE_CLIENT_ID
#    - AZURE_TENANT_ID
#    - AZURE_SUBSCRIPTION_ID
#    - AZURE_REGISTRY_NAME (e.g., scasregistry)
#    - AZURE_WEBAPP_NAME (e.g., scas-backend-app)
#    - AZURE_STATIC_WEB_APPS_API_TOKEN
# 2. Trigger manually via workflow_dispatch or automatically via completed CI runs.

permissions:
  id-token: write
  contents: read

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Docker image tag to deploy (e.g. commit SHA or latest).'
        required: true
        default: 'latest'
      skip_smoke_test:
        description: 'Skip smoke tests during deployment'
        required: false
        default: 'false'
  workflow_run:
    workflows: ["Backend CI", "Frontend CI"]
    types: [completed]
    branches: [main]

jobs:
  check-all-passed:
    name: Verify All CI Workflows Passed & Resolve Tag
    runs-on: ubuntu-22.04
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    outputs:
      should-deploy: ${{ steps.check.outputs.result }}
      image_tag: ${{ steps.resolve-tag.outputs.image_tag }}
    steps:
      - name: Resolve image tag
        id: resolve-tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.image_tag || '' }}
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha || '' }}
          WORKFLOW_RUN_PR_SHA: ${{ github.event.workflow_run.pull_requests[0].head.sha || '' }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_run" ] && [ -n "$WORKFLOW_RUN_SHA" ]; then
            TAG="$WORKFLOW_RUN_SHA"
          elif [ "$EVENT_NAME" = "workflow_run" ] && [ -n "$WORKFLOW_RUN_PR_SHA" ]; then
            TAG="$WORKFLOW_RUN_PR_SHA"
          elif [ -n "$INPUT_TAG" ]; then
            TAG="$(printf '%s' "$INPUT_TAG" | xargs)"
          elif [ -n "$GITHUB_SHA" ]; then
            TAG="$GITHUB_SHA"
          else
            echo "ERROR: image_tag cannot be resolved."
            exit 1
          fi

          echo "image_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved image tag for Azure deployment: '$TAG'"

      - name: Check status
        id: check
        run: echo "result=true" >> "$GITHUB_OUTPUT"

  deploy-azure:
    name: Deploy to Azure (App Service & Static Web Apps)
    runs-on: ubuntu-22.04
    needs: check-all-passed
    env:
      SKIP_SMOKE_TEST: ${{ github.event.inputs.skip_smoke_test || 'false' }}
      IMAGE_TAG: ${{ needs.check-all-passed.outputs.image_tag }}
      BACKEND_URL: "https://${{ secrets.AZURE_WEBAPP_NAME }}.azurewebsites.net"
      FRONTEND_URL: "https://thankful-field-093367500.7.azurestaticapps.net"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. Secure Azure Login using OIDC Federated Credentials (Keyless Authentication)
      - name: Azure Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # 2. Update Backend Azure App Service Container Image
      - name: Deploy Backend Container to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          images: '${{ secrets.AZURE_REGISTRY_NAME }}.azurecr.io/scas-backend:${{ env.IMAGE_TAG }}'

      # 3. Build & Deploy Frontend to Azure Static Web Apps
      - name: Build and Deploy Frontend to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/" # Location of frontend application code
          api_location: ""  # Optional API location
          output_location: "dist" # Built output folder for React/Vite

      # 4. Backend Health & CORS Verification (Smoke Test)
      - name: Run Backend Smoke Test
        if: ${{ env.SKIP_SMOKE_TEST != 'true' }}
        run: |
          echo "Verifying backend health on Azure App Service..."
          
          HTTP_STATUS=$(curl -sS --retry 10 --retry-delay 15 --retry-connrefused --max-time 30 \
            -o /tmp/azure-health.txt -w "%{http_code}" "${{ env.BACKEND_URL }}/actuator/health" || true)

          echo "HTTP_STATUS=${HTTP_STATUS}"
          cat /tmp/azure-health.txt || true

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "Smoke test FAILED: Backend health returned HTTP ${HTTP_STATUS}"
            exit 1
          fi

          echo "Smoke test PASSED: Azure App Service backend is healthy."

      - name: Skip Smoke Test Log
        if: ${{ env.SKIP_SMOKE_TEST == 'true' }}
        run: echo "Skipping smoke test based on execution parameter."

      - name: Notify on Deployment Success
        if: success()
        run: echo "Deployment to Azure succeeded for tag ${{ env.IMAGE_TAG }}"

      - name: Notify on Deployment Failure
        if: failure()
        run: echo "Deployment to Azure FAILED. Check App Service container logs and SWA build output."