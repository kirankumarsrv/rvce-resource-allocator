name: Deploy to Kubernetes
permissions:
  id-token: write
  contents: read

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'ECR image tag to deploy (for example full commit SHA or latest)'
        required: false
        default: 'latest'
  workflow_run:
    workflows: ["Backend CI", "Frontend CI"]
    types: [completed]
    branches: [main]

jobs:
  check-all-passed:
    name: Verify All CI Workflows Passed
    runs-on: ubuntu-22.04
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    outputs:
      should-deploy: ${{ steps.check.outputs.result }}
      image_tag: ${{ steps.resolve-tag.outputs.value }}
    steps:
      - name: Resolve image tag
        id: resolve-tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.image_tag }}
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          DEFAULT_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_run" ] && [ -n "$WORKFLOW_RUN_SHA" ]; then
            TAG="$WORKFLOW_RUN_SHA"
          elif [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="$DEFAULT_SHA"
          fi

          echo "value=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved image tag: $TAG"

      - name: Check all workflows passed
        id: check
        run: |
          echo "Deploying commit: ${{ github.sha }}"
          echo "result=true" >> $GITHUB_OUTPUT

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-22.04
    needs: check-all-passed
    environment:
      name: staging
      url: https://staging.scas.rvce.edu.in

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (Assume role via OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Update kubeconfig for EKS
        env:
          AWS_TARGET_REGION: ${{ secrets.AWS_REGION }}
        run: |
          aws eks update-kubeconfig --region $AWS_TARGET_REGION --name scas-cluster

      - name: Deploy to staging namespace
        env:
          IMAGE_TAG: ${{ needs.check-all-passed.outputs.image_tag }}
          ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
          NAMESPACE: scas-staging
        run: |
          kubectl set image deployment/scas-backend \
            backend="${ECR_REGISTRY}/scas-backend:${IMAGE_TAG}" \
            -n ${NAMESPACE}

          kubectl set image deployment/scas-frontend \
            frontend="${ECR_REGISTRY}/scas-frontend:${IMAGE_TAG}" \
            -n ${NAMESPACE}

      - name: Wait for rollout to complete
        run: |
          kubectl rollout status deployment/scas-backend \
            -n scas-staging --timeout=5m
          kubectl rollout status deployment/scas-frontend \
            -n scas-staging --timeout=5m

      - name: Run smoke tests against staging
        run: |
          echo "Checking staging services..."
          kubectl get svc -n scas-staging

          SERVICE_TYPE=$(kubectl get svc scas-backend -n scas-staging -o jsonpath='{.spec.type}')
          echo "Service type: $SERVICE_TYPE"

          if [ "$SERVICE_TYPE" != "LoadBalancer" ]; then
            echo "Service is not LoadBalancer; using port-forward instead..."
            kubectl port-forward svc/scas-backend 8080:80 -n scas-staging > /tmp/portforward.log 2>&1 &
            PORT_FORWARD_PID=$!
            for i in {1..15}; do
              if bash -c '</dev/tcp/127.0.0.1/8080' >/dev/null 2>&1; then
                echo "Port-forward is ready"
                break
              fi
              echo "Waiting for local port-forward to become available..."
              sleep 1
            done
            if ! bash -c '</dev/tcp/127.0.0.1/8080' >/dev/null 2>&1; then
              echo "Port-forward did not become ready. Last port-forward log:"
              tail -n 20 /tmp/portforward.log || true
              kill "$PORT_FORWARD_PID" || true
              exit 1
            fi
            LB_IP="127.0.0.1:8080"
          else
            echo "Waiting for LoadBalancer endpoint..."
            for i in {1..30}; do
              LB_IP=$(kubectl get svc scas-backend -n scas-staging -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || \
                      kubectl get svc scas-backend -n scas-staging -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null)
              if [ -n "$LB_IP" ]; then
                echo "LoadBalancer IP obtained: $LB_IP"
                break
              fi
              echo "Attempt $i: LoadBalancer IP not yet assigned, retrying..."
              sleep 2
            done

            if [ -z "$LB_IP" ]; then
              echo "LoadBalancer IP not available, using port-forward instead..."
              kubectl port-forward svc/scas-backend 8080:80 -n scas-staging > /tmp/portforward.log 2>&1 &
              PORT_FORWARD_PID=$!
              for i in {1..15}; do
                if bash -c '</dev/tcp/127.0.0.1/8080' >/dev/null 2>&1; then
                  echo "Port-forward is ready"
                  break
                fi
                echo "Waiting for local port-forward to become available..."
                sleep 1
              done
              if ! bash -c '</dev/tcp/127.0.0.1/8080' >/dev/null 2>&1; then
                echo "Port-forward did not become ready. Last port-forward log:"
                tail -n 20 /tmp/portforward.log || true
                kill "$PORT_FORWARD_PID" || true
                exit 1
              fi
              LB_IP="127.0.0.1:8080"
            fi
          fi

          echo "Backend endpoint: $LB_IP"
          
          HTTP_STATUS=$(curl -sS --retry 3 --retry-delay 2 --retry-connrefused \
            -o /tmp/staging-health.txt -w "%{http_code}" "http://${LB_IP}/actuator/health" 2>&1 || echo "000")
          
          echo "HTTP_STATUS=${HTTP_STATUS}"
          cat /tmp/staging-health.txt || true
          
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "Smoke test PASSED: health check returned 200"
          else
            echo "Smoke test FAILED: health check returned ${HTTP_STATUS}"
            exit 1
          fi

      - name: Notify on success
        if: success()
        run: |
          echo "Deployment to staging succeeded: ${{ github.sha }}"

      - name: Rollback on failure
        if: failure()
        run: |
          echo "Deployment FAILED. Rolling back..."
          kubectl rollout undo deployment/scas-backend -n scas-staging
          kubectl rollout undo deployment/scas-frontend -n scas-staging
          echo "Rollback complete"

  deploy-production:
    name: Deploy to Production (Manual Approval)
    runs-on: ubuntu-22.04
    needs: deploy-staging
    environment:
      name: production
      url: https://scas.rvce.edu.in

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (Assume role via OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Update kubeconfig
        env:
          AWS_TARGET_REGION: ${{ secrets.AWS_REGION }}
        run: aws eks update-kubeconfig --region $AWS_TARGET_REGION --name scas-cluster

      - name: Blue-Green deploy to production
        env:
          IMAGE_TAG: ${{ needs.check-all-passed.outputs.image_tag }}
          ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
          NAMESPACE: scas-prod
        run: |
          kubectl set image deployment/scas-backend \
            backend="${ECR_REGISTRY}/scas-backend:${IMAGE_TAG}" \
            -n ${NAMESPACE}

          kubectl set image deployment/scas-frontend \
            frontend="${ECR_REGISTRY}/scas-frontend:${IMAGE_TAG}" \
            -n ${NAMESPACE}

      - name: Wait for production rollout
        run: |
          kubectl rollout status deployment/scas-backend -n scas-prod --timeout=5m
          kubectl rollout status deployment/scas-frontend -n scas-prod --timeout=5m

      - name: Production smoke test
        run: |
          echo "Checking production services..."
          kubectl get svc -n scas-prod

          SERVICE_TYPE=$(kubectl get svc scas-backend -n scas-prod -o jsonpath='{.spec.type}')
          echo "Service type: $SERVICE_TYPE"

          if [ "$SERVICE_TYPE" != "LoadBalancer" ]; then
            echo "Service is not LoadBalancer; using port-forward instead..."
            kubectl port-forward svc/scas-backend 8080:80 -n scas-prod > /tmp/portforward.log 2>&1 &
            PORT_FORWARD_PID=$!
            for i in {1..15}; do
              if bash -c '</dev/tcp/127.0.0.1/8080' >/dev/null 2>&1; then
                echo "Port-forward is ready"
                break
              fi
              echo "Waiting for local port-forward to become available..."
              sleep 1
            done
            if ! bash -c '</dev/tcp/127.0.0.1/8080' >/dev/null 2>&1; then
              echo "Port-forward did not become ready. Last port-forward log:"
              tail -n 20 /tmp/portforward.log || true
              kill "$PORT_FORWARD_PID" || true
              exit 1
            fi
            LB_IP="127.0.0.1:8080"
          else
            echo "Waiting for LoadBalancer endpoint..."
            for i in {1..30}; do
              LB_IP=$(kubectl get svc scas-backend -n scas-prod -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || \
                      kubectl get svc scas-backend -n scas-prod -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null)
              if [ -n "$LB_IP" ]; then
                echo "LoadBalancer IP obtained: $LB_IP"
                break
              fi
              echo "Attempt $i: LoadBalancer IP not yet assigned, retrying..."
              sleep 2
            done

            if [ -z "$LB_IP" ]; then
              echo "LoadBalancer IP not available, using port-forward instead..."
              kubectl port-forward svc/scas-backend 8080:80 -n scas-prod > /tmp/portforward.log 2>&1 &
              PORT_FORWARD_PID=$!
              for i in {1..15}; do
                if bash -c '</dev/tcp/127.0.0.1/8080' >/dev/null 2>&1; then
                  echo "Port-forward is ready"
                  break
                fi
                echo "Waiting for local port-forward to become available..."
                sleep 1
              done
              if ! bash -c '</dev/tcp/127.0.0.1/8080' >/dev/null 2>&1; then
                echo "Port-forward did not become ready. Last port-forward log:"
                tail -n 20 /tmp/portforward.log || true
                kill "$PORT_FORWARD_PID" || true
                exit 1
              fi
              LB_IP="127.0.0.1:8080"
            fi
          fi

          echo "Backend endpoint: $LB_IP"
          
          HTTP_STATUS=$(curl -sS --retry 3 --retry-delay 2 --retry-connrefused \
            -o /tmp/production-health.txt -w "%{http_code}" "http://${LB_IP}/actuator/health" 2>&1 || echo "000")
          
          echo "HTTP_STATUS=${HTTP_STATUS}"
          cat /tmp/production-health.txt || true
          
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "Smoke test PASSED: health check returned 200"
          else
            echo "Smoke test FAILED: health check returned ${HTTP_STATUS}"
            exit 1
          fi

      - name: Rollback production on failure
        if: failure()
        run: |
          kubectl rollout undo deployment/scas-backend -n scas-prod
          kubectl rollout undo deployment/scas-frontend -n scas-prod
